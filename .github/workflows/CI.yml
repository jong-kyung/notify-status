name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: notify-status
  MACOSX_DEPLOYMENT_TARGET: '10.14'
  NAPI_BUILD_FLAGS: '--platform --release --no-const-enum --js binding.cjs --dts binding.d.cts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: vp install --frozen-lockfile
      - name: vp check (fmt + lint + type-check)
        run: vp check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: vp install --frozen-lockfile
      - name: build native
        run: vp exec napi build ${{ env.NAPI_BUILD_FLAGS }} --target ${{ matrix.target }}
        shell: bash
      - name: build ts (vp pack)
        run: vp pack
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux-source-build:
    # No prebuilt Linux artifact ships, but build-from-source on Linux exercises
    # the Linux branch (R8 / AE5 — unsupportedPlatform payload, never throws).
    name: test / linux (source build)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: vp install --frozen-lockfile
      - run: vp run build:debug
      - run: vp test

  test-macos:
    name: test / macos-latest
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test

  test-windows-x64:
    name: test / windows-latest
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test

  arm64-smoke:
    # Cross-compiled aarch64-pc-windows-msvc produces a .node binary that's
    # never executed on ARM64 in the build job. This load-test on a
    # GitHub-hosted ARM64 Windows runner verifies the binary actually loads.
    name: smoke / windows-11-arm
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - name: smoke load (ESM)
        shell: pwsh
        run: |
          node --input-type=module -e "const m = await import('./dist/index.mjs'); const r = await m.getNotificationStatus(); console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1);"
      - name: smoke load (CJS)
        shell: pwsh
        run: |
          node -e "const m = require('./dist/index.cjs'); m.getNotificationStatus().then(r => { console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1); }).catch(err => { console.error(err); process.exit(1); });"

  cargo-test:
    name: cargo test (Rust unit tests)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
