name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: notify-status
  MACOSX_DEPLOYMENT_TARGET: "10.14"
  NAPI_BUILD_FLAGS: "--platform --release --no-const-enum --js binding.cjs --dts binding.d.cts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: vp install --frozen-lockfile
      - name: vp check (fmt + lint + type-check)
        run: vp check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-shear
      - run: cargo shear

  build:
    name: build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: vp install --frozen-lockfile
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: build native
        run: vp exec napi build ${{ env.NAPI_BUILD_FLAGS }} --target ${{ matrix.target }}
        shell: bash
      - name: test Windows Rust lifecycle
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --lib -- --test-threads=1
      - name: test registered Windows desktop app
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --lib -- --exact windows::registered_app_tests::registered_aumid_queries_preserve_winrt_lifecycle --include-ignored --test-threads=1 --nocapture
      - name: build ARM64 Rust test executable
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $messages = cargo test --locked --lib --target aarch64-pc-windows-msvc --no-run --message-format=json | ForEach-Object { $_ | ConvertFrom-Json }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @($messages | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'notify_status' -and $_.profile.test -and $_.executable })
          if ($tests.Count -ne 1) { throw "Expected exactly one Rust test executable" }
          Copy-Item $tests[0].executable target/notify-status-tests-arm64.exe
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          name: rust-tests-aarch64-pc-windows-msvc
          path: target/notify-status-tests-arm64.exe
          if-no-files-found: error
      - name: build ts (vp pack)
        run: vp pack
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux-source-build:
    # No Linux addon ships. Build the JS entry points and verify safe imports
    # and unsupportedPlatform responses without a native binding.
    name: test / linux (source build)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test

  test-macos:
    name: test / macos-latest
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test

  test-windows-x64:
    name: test / windows-latest
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test

  arm64-smoke:
    # Execute the cross-compiled Rust tests on ARM64, including direct WNF calls
    # that bypass the no-AUMID early return, then check the Node entry points.
    name: smoke / windows-11-arm
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: rust-tests-aarch64-pc-windows-msvc
          path: target
      - name: test ARM64 native WNF and WinRT lifecycle
        env:
          NOTIFY_STATUS_TEST_ARCH: aarch64
        run: ./target/notify-status-tests-arm64.exe --test-threads=1 --nocapture
      - name: test registered ARM64 Windows desktop app
        run: ./target/notify-status-tests-arm64.exe --exact windows::registered_app_tests::registered_aumid_queries_preserve_winrt_lifecycle --include-ignored --test-threads=1 --nocapture
      - run: vp install --frozen-lockfile
      - run: vp pack
      - name: smoke load (ESM)
        shell: pwsh
        run: |
          node --input-type=module -e "const m = await import('./dist/index.mjs'); const r = await m.getNotificationStatus(); console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1);"
      - name: smoke load (CJS)
        shell: pwsh
        run: |
          node -e "const m = require('./dist/index.cjs'); m.getNotificationStatus().then(r => { console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1); }).catch(err => { console.error(err); process.exit(1); });"

  cargo-test:
    name: cargo test (Rust unit tests)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
