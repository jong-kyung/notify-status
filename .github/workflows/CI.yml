name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: notify-status
  MACOSX_DEPLOYMENT_TARGET: '10.14'
  NAPI_BUILD_FLAGS: '--platform --release --no-const-enum --js binding.cjs --dts binding.d.cts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: vp install --frozen-lockfile
      - name: vp check (fmt + lint + type-check)
        run: vp check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: vp install --frozen-lockfile
      - name: build native
        run: vp exec napi build ${{ env.NAPI_BUILD_FLAGS }} --target ${{ matrix.target }}
        shell: bash
      - name: build ts (vp pack)
        run: vp pack
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux-source-build:
    # No prebuilt Linux artifact ships, but build-from-source on Linux exercises
    # the Linux branch (R8 / AE5 — unsupportedPlatform payload, never throws).
    name: test / linux (source build)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: vp install --frozen-lockfile
      - run: vp run build:debug
      - run: vp test
      - run: vp run test:types

  test-macos:
    name: test / macos-latest
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test
      - run: vp run test:types

  test-windows-x64:
    name: test / windows-latest
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test
      - run: vp run test:types

  arm64-smoke:
    # Cross-compiled aarch64-pc-windows-msvc produces a .node binary that's
    # never executed on ARM64 in the build job. This load-test on a
    # GitHub-hosted ARM64 Windows runner verifies the binary actually loads
    # and resolves a Promise before publish.
    name: smoke / windows-11-arm
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - name: smoke load (ESM)
        shell: pwsh
        run: |
          node --input-type=module -e "const m = await import('./dist/index.mjs'); const r = await m.getNotificationStatus(); console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1);"
      - name: smoke load (CJS)
        shell: pwsh
        run: |
          node -e "const m = require('./dist/index.cjs'); m.getNotificationStatus().then(r => { console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1); }).catch(err => { console.error(err); process.exit(1); });"

  cargo-test:
    name: cargo test (Rust unit tests)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  publish:
    # Tag-triggered release. Push a tag matching v*.*.* (e.g. `git tag v1.2.3
    # && git push origin v1.2.3`) to publish. Branch pushes never reach this
    # job, so accidental publishes from main commits are impossible.
    name: publish
    runs-on: ubuntu-latest
    needs:
      - test-linux-source-build
      - test-macos
      - test-windows-x64
      - arm64-smoke
      - cargo-test
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: create npm dirs
        # napi artifacts writes into npm/<target>/ but doesn't mkdir parents.
        # npm/ is gitignored, so without this step the publish job fails with
        # ENOENT on the first tag-driven run.
        run: vp exec napi create-npm-dirs
      - name: move artifacts
        run: vp run artifacts
      - run: ls -R ./npm
      - name: build ts (vp pack)
        run: vp pack
      - name: publish
        # `npm publish` runs the prepublishOnly lifecycle script
        # (= `napi prepublish -t npm`), which publishes per-triple
        # subpackages and creates the GitHub release. Both need
        # NODE_AUTH_TOKEN and GITHUB_TOKEN, which are inherited by the
        # spawned npm child processes from this step's env. A separate
        # explicit `prepublish` step would either run without auth (when
        # no env: block) or duplicate the lifecycle work, causing 409s on
        # subpackage re-publish.
        run: |
          npm config set provenance true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: rename release
        # napi prepublish creates the GitHub release with name = commit
        # message (often a merge commit subject). Override to the canonical
        # `<package>@<version>` format. ${VAR#v} strips the leading `v`
        # from the tag (v1.0.0 → 1.0.0).
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --title "${APP_NAME}@${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
