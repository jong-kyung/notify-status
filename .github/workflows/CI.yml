name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: notify-status
  MACOSX_DEPLOYMENT_TARGET: '10.14'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: tsc (typecheck)
        run: pnpm exec tsc --noEmit
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build:native -- --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build:native -- --target x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm run build:native -- --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm run build:native -- --target aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: build native
        run: ${{ matrix.build }}
        shell: bash
      - name: build ts
        run: pnpm run build:ts
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux-source-build:
    # No prebuilt Linux artifact ships, but build-from-source on Linux exercises
    # the Linux branch (R8 / AE5 — unsupportedPlatform payload, never throws).
    name: test / linux (source build)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:debug
      - run: pnpm test
      - run: pnpm test:types

  test-macos:
    name: test / macos-latest
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - run: pnpm test
      - run: pnpm test:types

  test-windows-x64:
    name: test / windows-latest
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - run: pnpm test
      - run: pnpm test:types

  arm64-smoke:
    # Cross-compiled aarch64-pc-windows-msvc produces a .node binary that's
    # never executed on ARM64 in the build job. This load-test on a
    # GitHub-hosted ARM64 Windows runner verifies the binary actually loads
    # and resolves a Promise before publish.
    name: smoke / windows-11-arm
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - name: smoke load
        shell: pwsh
        run: |
          node --input-type=module -e "const m = await import('./dist/index.js'); const r = await m.getNotificationStatus(); console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1);"

  cargo-test:
    name: cargo test (Rust unit tests)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - test-linux-source-build
      - test-macos
      - test-windows-x64
      - arm64-smoke
      - cargo-test
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: move artifacts
        run: pnpm run artifacts
      - run: ls -R ./npm
      - name: build ts
        run: pnpm run build:ts
      - name: prepublish
        run: pnpm run prepublishOnly
      - name: publish
        run: |
          npm config set provenance true
          if git log -1 --pretty=%B | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            npm publish --access public
          else
            echo "Not a release commit; skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
