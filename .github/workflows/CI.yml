name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: notify-status
  MACOSX_DEPLOYMENT_TARGET: '10.14'
  NAPI_BUILD_FLAGS: '--platform --release --no-const-enum --js binding.cjs --dts binding.d.cts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: vp install --frozen-lockfile
      - name: vp check (fmt + lint + type-check)
        run: vp check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: vp install --frozen-lockfile
      - name: build native
        run: vp exec napi build ${{ env.NAPI_BUILD_FLAGS }} --target ${{ matrix.target }}
        shell: bash
      - name: build ts (vp pack)
        run: vp pack
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux-source-build:
    # No prebuilt Linux artifact ships, but build-from-source on Linux exercises
    # the Linux branch (R8 / AE5 — unsupportedPlatform payload, never throws).
    name: test / linux (source build)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: vp install --frozen-lockfile
      - run: vp run build:debug
      - run: vp test
      - run: vp run test:types

  test-macos:
    name: test / macos-latest
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test
      - run: vp run test:types

  test-windows-x64:
    name: test / windows-latest
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: vp test
      - run: vp run test:types

  arm64-smoke:
    # Cross-compiled aarch64-pc-windows-msvc produces a .node binary that's
    # never executed on ARM64 in the build job. This load-test on a
    # GitHub-hosted ARM64 Windows runner verifies the binary actually loads
    # and resolves a Promise before publish.
    name: smoke / windows-11-arm
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: .
      - run: vp install --frozen-lockfile
      - run: vp pack
      - name: smoke load (ESM)
        shell: pwsh
        run: |
          node --input-type=module -e "const m = await import('./dist/index.mjs'); const r = await m.getNotificationStatus(); console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1);"
      - name: smoke load (CJS)
        shell: pwsh
        run: |
          node -e "const m = require('./dist/index.cjs'); m.getNotificationStatus().then(r => { console.log(JSON.stringify(r)); if (typeof r.authorization !== 'string') process.exit(1); }).catch(err => { console.error(err); process.exit(1); });"

  cargo-test:
    name: cargo test (Rust unit tests)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  detect_version_change:
    name: detect package version change
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      changed: ${{ steps.version.outputs.changed }}
      published: ${{ steps.version.outputs.published }}
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: compare package versions
        id: version
        shell: bash
        run: |
          current_version=$(node -p "require('./package.json').version")
          previous_version=""
          changed=false
          published=false
          release_needed=false

          if npm view "notify-status@$current_version" version >/dev/null 2>&1; then
            published=true
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            before="${{ github.event.before }}"
            empty_tree="0000000000000000000000000000000000000000"

            if [ -n "$before" ] && [ "$before" != "$empty_tree" ] && git cat-file -e "$before:package.json" 2>/dev/null; then
              previous_version=$(git show "$before:package.json" | node -e "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")

              if [ "$previous_version" != "$current_version" ]; then
                changed=true
              fi
            fi

            if [ "$changed" = "true" ] || [ "$published" != "true" ]; then
              release_needed=true
            fi
          fi

          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

  publish:
    # Releases publish automatically when package.json's version changes on a
    # main push (typically a merged release PR). If a version bump merged before
    # this automation and is still unpublished, the next main push retries it.
    # Pushing a v* tag remains a manual fallback.
    name: publish
    runs-on: ubuntu-latest
    needs:
      - detect_version_change
      - test-linux-source-build
      - test-macos
      - test-windows-x64
      - arm64-smoke
      - cargo-test
    if: >-
      github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect_version_change.outputs.release_needed == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: vp install --frozen-lockfile
      - name: create release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect_version_change.outputs.release_needed == 'true'
        shell: bash
        run: |
          tag="v${{ needs.detect_version_change.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit=$(git rev-parse "$tag^{commit}")

            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists at $tag_commit, expected $GITHUB_SHA"
              exit 1
            fi

            echo "Tag $tag already exists at this commit; continuing."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: create npm dirs
        # napi artifacts won't mkdir; npm/ is gitignored.
        run: vp exec napi create-npm-dirs
      - name: move artifacts
        run: vp run artifacts
      - run: ls -R ./npm
      - name: build ts (vp pack)
        run: vp pack
      - name: publish
        # GITHUB_TOKEN is needed by the prepublishOnly lifecycle (napi prepublish creates the GH release).
        run: |
          npm config set provenance true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: rename release
        # napi prepublish names the release after the commit subject.
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            tag="v${{ needs.detect_version_change.outputs.version }}"
          fi

          gh release edit "$tag" --title "${APP_NAME}@${tag#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
