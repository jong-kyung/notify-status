[package]
name    = "notify-status"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Cross-platform notification authorization and DND status for Node via NAPI-RS"
repository = "https://github.com/jklee/notify-status"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "3.8", default-features = false, features = ["napi3", "async", "error_anyhow"] }
napi-derive = "3.5"
anyhow      = "1"
tokio       = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSDictionary", "NSArray", "NSError", "NSException", "NSObjCRuntime"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

[build-dependencies]
napi-build = "2.3"

[profile.release]
codegen-units = 1
lto           = true
strip         = "symbols"
